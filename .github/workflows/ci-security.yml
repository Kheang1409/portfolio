name: CI Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  # Backend Quality Gates
  backend-quality:
    name: Backend Quality (Restore, Build, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Install NuGet packages
        run: dotnet restore KaiAssistant.sln

      - name: Build solution (Release)
        run: dotnet build KaiAssistant.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test KaiAssistant.Tests/KaiAssistant.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Run RAG evaluation tests
        run: dotnet test KaiAssistant.RagEvaluation/KaiAssistant.RagEvaluation.csproj --configuration Release --no-build --logger "trx;LogFileName=rag-eval-results.trx" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults/
          retention-days: 7

  # Backend Security Gates
  backend-security:
    name: Backend Security (NuGet Audit + Secret Scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Install NuGet packages
        run: dotnet restore KaiAssistant.sln

      - name: Run NuGet vulnerability audit
        run: dotnet list KaiAssistant.sln package --vulnerable --include-transitive

      - name: Run NuGet audit with SARIF output
        run: |
          dotnet tool install --global dotnet-scan || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet scan KaiAssistant.sln --format sarif --output nuget-audit.sarif || true

      - name: Upload NuGet audit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend/nuget-audit.sarif
          category: nuget-audit

      - name: Run secret scanning (truffleHog)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71
        with:
          path: ./backend
          base: ${{ github.event.pull_request.base.sha || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --json --fail

  # Frontend Quality Gates
  frontend-quality:
    name: Frontend Quality (Lint, Type-Check, Build, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-progress

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run production build
        run: npm run build
        env:
          BACKEND_API_URL: http://localhost:5000

      - name: Run Playwright tests
        run: npm test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Frontend Security Gates
  frontend-security:
    name: Frontend Security (npm Audit + Secret Scan)
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore cached dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-progress --prefer-offline

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run npm audit with SARIF output
        run: |
          npm audit --json > npm-audit.json || true
          npx audit-ci --config audit-ci.json --output sarif --output-file npm-audit.sarif || true

      - name: Upload npm audit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: frontend/npm-audit.sarif
          category: npm-audit

      - name: Run secret scanning (truffleHog)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71
        with:
          path: ./frontend
          base: ${{ github.event.pull_request.base.sha || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --json --fail

  # Container Security Gates
  container-security:
    name: Container Security (Trivy Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t portfolio-backend:scan -f backend/Dockerfile .
        working-directory: .

      - name: Build frontend Docker image
        run: |
          docker build -t portfolio-frontend:scan -f frontend/Dockerfile .
        working-directory: .

      - name: Run Trivy vulnerability scanner on backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'portfolio-backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner on frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'portfolio-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload Trivy backend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: container-scan-backend

      - name: Upload Trivy frontend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: container-scan-frontend

      - name: Run Trivy config audit on docker-compose files
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy config results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: container-config-audit

  # CodeQL Analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['csharp', 'javascript-typescript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,+security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Dependency Review (for PRs)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: 'high'

  # Overall status check
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-security, frontend-quality, frontend-security, container-security, codeql-analysis, dependency-review]
    if: always()
    steps:
      - name: Check all quality and security jobs passed
        run: |
          echo "Backend Quality: ${{ needs.backend-quality.result }}"
          echo "Backend Security: ${{ needs.backend-security.result }}"
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "Frontend Security: ${{ needs.frontend-security.result }}"
          echo "Container Security: ${{ needs.container-security.result }}"
          echo "CodeQL Analysis: ${{ needs.codeql-analysis.result }}"
          echo "Dependency Review: ${{ needs.dependency-review.result }}"

          FAILED=0
          for job in backend-quality backend-security frontend-quality frontend-security container-security codeql-analysis dependency-review; do
            result="${{ needs.$job.result }}"
            if [[ "$result" != "success" ]]; then
              echo "FAILED: $job = $result"
              FAILED=1
            fi
          done

          if [[ $FAILED -eq 1 ]]; then
            echo "::error::One or more quality/security gates failed"
            exit 1
          fi

          echo "All quality and security gates passed!"